name: Deploy

run-name: Deploy ${{ inputs.ref }} to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA to deploy
        required: true
        default: develop
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - preprod
          - prod
      confirm:
        description: I confirm a deployment to production
        type: boolean
        default: false

permissions:
  contents: read

# One deployment at a time per environment
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ inputs.environment }}

jobs:
  resolve:
    name: Resolve ${{ inputs.ref }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}

    steps:
      # Pin the ref to a commit so that every app gets the same code
      - name: Resolve ref to a commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          # The confirmation box replaces the missing "are you sure?" dialog
          if [[ "$ENVIRONMENT" == "prod" && "$CONFIRM" != "true" ]]; then
            echo "::error::Production deployment not confirmed: tick the confirmation box when launching the workflow"
            exit 1
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying \`$REF\` ($sha) to **$ENVIRONMENT**" >> "$GITHUB_STEP_SUMMARY"

  # The front apps deploy in parallel.
  deploy:
    name: Deploy ${{ matrix.workspace }}
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 40
    strategy:
      # A failed app must not interrupt the deployments already running
      fail-fast: false
      matrix:
        workspace: [tenantv3, owner, www, watermark]
        include:
          - workspace: tenantv3
            preprod: dossierfacile-front-staging-locataire
            prod: dossierfacile-front-prod-locataire
            prod_region: osc-fr1
          - workspace: owner
            preprod: dossierfacile-front-staging-owner
            prod: dossierfacile-front-prod-owner
            prod_region: osc-secnum-fr1
          - workspace: www
            preprod: dossierfacile-front-staging-www
            prod: dossierfacile-front-prod-www
            prod_region: osc-fr1
          - workspace: watermark
            preprod: dossierfacile-filigrane-preprod-front
            prod: dossierfacile-filigrane-prod-front
            prod_region: osc-secnum-fr1

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Deploy to Scalingo
        env:
          SCALINGO_API_TOKEN: ${{ secrets.SCALINGO_API_TOKEN }}
          SHA: ${{ needs.resolve.outputs.sha }}
          APP: ${{ matrix[inputs.environment] }}
          SCALINGO_REGION: ${{ inputs.environment == 'prod' && matrix.prod_region || 'osc-fr1' }}
        run: bash .github/scripts/scalingo-deploy.sh "$APP" "$SCALINGO_REGION" "$SHA"
