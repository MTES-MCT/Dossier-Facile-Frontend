name: E2E

on:
  schedule:
    - cron: "53 7 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  tests-on-preprod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies for e2e-tests
        working-directory: e2e-tests
        run: pnpm install

      - name: Run e2e tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: e2e-tests
          install: false
          config-file: cypress-preprod.config.ts
          browser: chrome
          spec: cypress/e2e/tenant/flatmate.cy.ts,cypress/e2e/tenant/alone.cy.ts
          env: configFile=ci
        env:
          CYPRESS_TESTMAIL_API_KEY: ${{ secrets.CYPRESS_TESTMAIL_API_KEY }}
          CYPRESS_TESTMAIL_NAMESPACE: ${{ vars.CYPRESS_TESTMAIL_NAMESPACE }}
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: e2e-tests/cypress/screenshots
          retention-days: 1
      - name: Upload videos
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const { execSync } = require('child_process')
            const root = 'e2e-tests/cypress/videos'
            if (!fs.existsSync(root)) {
              core.info(`No videos directory at ${root}`)
              return
            }
            // @actions/artifact is not bundled in github-script — install on the fly
            execSync('npm install --no-audit --no-fund --prefix /tmp/artifact-deps @actions/artifact', { stdio: 'inherit' })
            const { DefaultArtifactClient } = require('/tmp/artifact-deps/node_modules/@actions/artifact')
            const client = new DefaultArtifactClient()
            const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true })
              .flatMap(d => d.isDirectory()
                ? walk(`${dir}/${d.name}`)
                : d.name.endsWith('.mp4') ? [`${dir}/${d.name}`] : [])
            for (const file of walk(root)) {
              const spec = file.replace(`${root}/`, '').replace(/\.cy\.ts\.mp4$/, '').replace(/\//g, '-')
              core.info(`Uploading ${file} as video-${spec}`)
              await client.uploadArtifact(`video-${spec}`, [file], root, { retentionDays: 1 })
            }
      - name: Mattermost alert
        if: failure()
        shell: bash
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Cypress creates one subdir under cypress/screenshots per spec that has at least one failed test
          failed_specs=()
          screenshots_dir="e2e-tests/cypress/screenshots"
          if [ -d "$screenshots_dir" ]; then
            while IFS= read -r dir; do
              failed_specs+=("$(basename "$dir" .cy.ts)")
            done < <(find "$screenshots_dir" -mindepth 1 -maxdepth 1 -type d | sort)
          fi
          count=${#failed_specs[@]}
          if [ "$count" -eq 0 ]; then
            spec_list="(no spec dirs found — see workflow logs)"
            count_label="e2e job"
          else
            spec_list=$(printf -- "- %s\n" "${failed_specs[@]}")
            count_label="$count spec(s)"
          fi
          text="[dossierfacile-preprod] $count_label failed:
          $spec_list
          [Failed workflow]($RUN_URL)"
          jq -n --arg t "$text" '{attachments:[{text:$t,color:"#FF8000",fallback:"e2e failed"}]}' | \
            curl -sS -X POST -H "Content-Type: application/json" --data @- "$MATTERMOST_WEBHOOK_URL"
