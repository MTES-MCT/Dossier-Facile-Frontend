name: CI

on:
  pull_request:
    branches: [develop]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ws: [www, tenantv3, owner, watermark]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          check-latest: true
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck ${{ matrix.ws }}
        run: pnpm --filter ${{ matrix.ws }} tsc

      - name: Typecheck tenant component tests
        if: ${{ matrix.ws == 'tenantv3' }}
        run: pnpm --filter tenantv3 test:component:types

      - name: Build ${{ matrix.ws }}
        run: pnpm --filter ${{ matrix.ws }} build

      - name: Run unit tests
        if: ${{ matrix.ws == 'www' || matrix.ws == 'tenantv3' || matrix.ws == 'owner' }}
        run: pnpm --filter ${{ matrix.ws }} test:unit

      - name: Install Chromium for tenant component tests
        if: ${{ matrix.ws == 'tenantv3' }}
        run: pnpm --filter tenantv3 exec playwright install --with-deps chromium

      - name: Run tenant component tests
        if: ${{ matrix.ws == 'tenantv3' }}
        run: pnpm --filter tenantv3 test:component

      - name: Upload tenant component screenshots
        if: ${{ matrix.ws == 'tenantv3' && (failure() || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v7
        with:
          name: tenant-component-screenshots
          path: |
            tenantv3/src/**/__screenshots__/
            tenantv3/.vitest/attachments/failure-screenshots/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 14 || 7 }}

      - name: Typecheck e2e tests
        if: ${{ matrix.ws == 'tenantv3' }}
        run: pnpm --filter e2e-tests tsc

      - name: Typecheck df-shared-next
        run: pnpm --filter df-shared-next tsc

      - name: Run df-shared-next tests
        run: pnpm --filter df-shared-next test:unit --run
